<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="diary.css">
    <script src="AD_diary.js" defer></script>
    <title>Дневник давления</title>
</head>
<body>
    <div class="container">
        <h1>📊 Дневник давления</h1>
        
        <div class="date-display" id="currentDate"></div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('input')">Ввод</div>
            <div class="tab" onclick="showTab('history')">История</div>
            <div class="tab" onclick="showTab('export')">Экспорт</div>
        </div>
        
        <!-- Вкладка ввода -->
        <div id="tab-input" class="tab-content active">
            <div class="input-group">
                <label>Верхнее давление (систола):</label>
                <input type="number" id="systolic" placeholder="120" min="50" max="250">
            </div>
            
            <div class="input-group">
                <label>Нижнее давление (диастола):</label>
                <input type="number" id="diastolic" placeholder="80" min="30" max="150">
            </div>
            
            <div class="input-group">
                <label>Пульс (уд/мин):</label>
                <input type="number" id="pulse" placeholder="75" min="30" max="200">
            </div>
            
            <div class="input-group">
                <label>Заметки (необязательно):</label>
                <textarea id="notes" rows="3" placeholder="Самочувствие, лекарства..."></textarea>
            </div>
            
            <button class="button" onclick="saveMeasurement()">💾 Сохранить измерение</button>
            
            <div id="status" style="margin-top: 15px; text-align: center;"></div>
        </div>
        
        <!-- Вкладка истории -->
        <div id="tab-history" class="tab-content">
            <div id="history-list"></div>
            <button class="button" onclick="clearAllData()" style="background: #ff4444;">🗑 Очистить всю историю</button>
        </div>
        
        <!-- Вкладка экспорта -->
        <div id="tab-export" class="tab-content">
            <p>Выгрузите данные для передачи врачу:</p>
            <button class="button export-btn" onclick="exportToCSV()">📥 Скачать CSV файл</button>
            <button class="button export-btn" onclick="exportToText()">📋 Скопировать как текст</button>
            <button class="button export-btn" onclick="printData()">🖨 Распечатать</button>
            
            <div id="export-result" style="margin-top: 20px; white-space: pre-wrap; background: #f0f0f0; padding: 10px; border-radius: 5px; display: none;"></div>
        </div>
    </div>
    <p><a href="https://moroz007.github.io/html_resume/">Вернуться на главную</a></p>
</body>
</html>
